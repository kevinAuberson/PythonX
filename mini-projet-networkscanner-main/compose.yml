networks:
  test_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.150.0/24
          gateway: 192.168.150.1

services:
  host1:
    image: alpine:3.21
    container_name: host1
    command: sh -c "apk add --no-cache iputils busybox-extras && httpd -f -p 80"
    networks:
      test_net:
        ipv4_address: 192.168.150.10

  host2:
    image: alpine:3.21
    container_name: host2
    command: sh -c "apk add --no-cache iputils busybox-extras && httpd -f -p 80"
    networks:
      test_net:
        ipv4_address: 192.168.150.11

  host3:
    image: alpine:3.21
    container_name: host3
    command: sh -c "apk add --no-cache iputils busybox-extras && httpd -f -p 80"
    networks:
      test_net:
        ipv4_address: 192.168.150.12

  host4:
    image: alpine:3.21
    container_name: host4
    command: sh -c "apk add --no-cache iputils busybox-extras && httpd -f -p 80"
    networks:
      test_net:
        ipv4_address: 192.168.150.13

  host5:
    image: alpine:3.21
    container_name: host5
    command: sh -c "apk add --no-cache iputils busybox-extras && httpd -f -p 80"
    networks:
      test_net:
        ipv4_address: 192.168.150.14

  scanner:
    # image: ghcr.io/pythonx-a/mini-projet-networkscanner/network-scanner:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanner
    command: sleep infinity
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    networks:
     test_net:
       ipv4_address: 192.168.150.100
    ports: 
      - 8080:8501
